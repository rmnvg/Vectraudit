repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Files written byte for byte by other libraries stay as they wrote them (LlamaIndex
      # saves a binary FAISS index as default__vector_store.json).
      - id: trailing-whitespace
        exclude: ^tests/fixtures/frameworks/(langchain|llamaindex)/
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/frameworks/(langchain|llamaindex)/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
