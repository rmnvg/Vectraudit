name: Feature request
description: Something Vectraudit should do, or do differently
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to decide or protect, and where Vectraudit fell short. A real situation helps more than a proposed solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: What you would like to run or see, if you have an idea.
  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: Scripts, other tools or manual checks you use instead.
