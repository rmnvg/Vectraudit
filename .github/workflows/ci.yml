name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      # PostgreSQL runs on every pull request: the control plane's tests need it, and it is
      # the one reliable service container. The other backends' live tests skip here and run
      # in backends.yml (pinned oldest and newest servers, nightly latest).
      VECTRAUDIT_TEST_PG_DSN: postgresql://postgres:va-test@localhost:5432/va
    services:
      postgres:
        # Keep in step with the `oldest` track in scripts/live_backends.py.
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_PASSWORD: va-test
          POSTGRES_DB: va
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-extras --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Check generated API contracts
        run: uv run python scripts/generate_api_types.py --check
      - name: Typecheck
        run: uv run mypy
      - name: Test
        run: uv run pytest -m "slow or not slow" --cov=vectraudit --cov-report=term-missing

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node scripts/third-party-notices.mjs --check
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npx oxlint src
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: static
          path: src/vectraudit/static

  package:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: static
          path: src/vectraudit/static
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Wheel contains the built UI
        run: unzip -l dist/*.whl | grep -q "vectraudit/static/index.html"
      - name: Test installed wheel in an isolated environment
        run: |
          uv venv "$RUNNER_TEMP/wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/wheel-smoke/bin/python" dist/*.whl faiss-cpu httpx
          "$RUNNER_TEMP/wheel-smoke/bin/python" -I tests/package_smoke.py
      - name: Reference search with installed wheel and independent application revisions
        run: |
          "$RUNNER_TEMP/wheel-smoke/bin/python" -I examples/real_pipeline_case_study.py --out "$RUNNER_TEMP/reference-search"
      - name: Preserve reference search reports and reproduction inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-search-case-study
          path: ${{ runner.temp }}/reference-search
          if-no-files-found: warn

  e2e:
    name: Browser smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra faiss-cpu --extra dev --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build UI
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Configure bounded Ubuntu dependency downloads
        timeout-minutes: 1
        run: |
          # Hosted runners can retry a stalled regional APT mirror (Azure or EC2) for tens of
          # minutes. Keep the existing suites/components, but use the official HTTPS mirrors.
          sudo python3 - <<'PY'
          import re
          from pathlib import Path

          paths = [Path('/etc/apt/sources.list'), Path('/etc/apt/apt-mirrors.txt'),
                   Path('/etc/apt/security-mirrors.txt')]
          paths += list(Path('/etc/apt/sources.list.d').glob('*.list'))
          paths += list(Path('/etc/apt/sources.list.d').glob('*.sources'))
          for path in paths:
              if not path.is_file():
                  continue
              original = path.read_text()
              updated = original
              updated = re.sub(r'https?://[a-z0-9.-]+\.archive\.ubuntu\.com/ubuntu',
                               'https://archive.ubuntu.com/ubuntu', updated)
              updated = updated.replace('http://archive.ubuntu.com/ubuntu',
                                        'https://archive.ubuntu.com/ubuntu')
              updated = updated.replace('http://security.ubuntu.com/ubuntu',
                                        'https://security.ubuntu.com/ubuntu')
              if updated != original:
                  path.write_text(updated)
          Path('/etc/apt/apt.conf.d/99-vectraudit-ci').write_text(
              'Acquire::Retries "1";\n'
              'Acquire::http::Timeout "20";\n'
              'Acquire::https::Timeout "20";\n'
          )
          PY
      - name: Install browser system dependencies
        timeout-minutes: 15
        working-directory: frontend
        # A slow mirror occasionally stalls one attempt; retry rather than fail the job.
        run: |
          for attempt in 1 2 3; do
            timeout 6m npx playwright install-deps chromium firefox webkit && exit 0
            echo "::warning::install-deps attempt $attempt failed; retrying"
            sleep 10
          done
          exit 1
      - name: Download browsers
        timeout-minutes: 5
        working-directory: frontend
        run: npx playwright install chromium firefox webkit
      - name: Run smoke tests
        working-directory: frontend
        run: npm run e2e
      - name: Retrieval workbench browser regression
        run: node scripts/workbench_smoke.mjs
      - name: Guided workflow browser regression
        run: node scripts/guided_smoke.mjs
      - name: Interrupted evaluation recovery browser journey
        run: node scripts/resume_smoke.mjs
      - name: Benchmark and regression case browser journey
        run: node scripts/guided_workflows_smoke.mjs
      - name: Retrieved passage review browser journey
        run: node scripts/passage_review_smoke.mjs
      - name: Registered document lookup browser journey
        run: node scripts/passage_review_smoke.mjs
        env:
          VECTRAUDIT_LOOKUP_SMOKE: "1"
      - name: Release policy and exported release check journey
        run: node scripts/release_smoke.mjs
      - name: Reference search browser comparison and export
        run: node scripts/reference_search_smoke.mjs
        env:
          VECTRAUDIT_REFERENCE_SMOKE_DIR: ${{ runner.temp }}/reference-browser
      - name: Preserve reference browser screenshots and trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-search-browser
          path: ${{ runner.temp }}/reference-browser
          if-no-files-found: warn
      - name: Local labelling browser regression
        run: node scripts/labelling_smoke.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
