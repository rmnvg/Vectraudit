name: Live backends

# The connector tests against real servers. Six service containers are the slowest and least
# predictable part of CI, so they run here rather than on every pull request: on pull
# requests that touch a connector, its tests or the dependencies; on main; nightly; and
# before each release (release.yml calls this workflow).
#
# scripts/live_backends.py holds the server versions. Two pinned tracks bound the tested
# range: `oldest` and `newest`. The nightly run adds `latest` (floating tags), so an upstream
# release that breaks a connector shows up within a day without blocking pull requests.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/vectraudit/connectors/**"
      - "tests/test_connector_*.py"
      - "tests/test_acceptance.py"
      - "tests/test_tune.py"
      - "tests/conftest.py"
      - "scripts/live_backends.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backends.yml"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  # Distinct from ci.yml's group: when release.yml calls both, github.workflow is "Release"
  # for each, and a shared group would cancel one of them.
  group: backends-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live:
    name: Live backends (${{ matrix.track }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        track: ${{ fromJSON(github.event_name == 'schedule' && '["oldest", "newest", "latest"]' || '["oldest", "newest"]') }}
    env:
      UV_PYTHON: "3.12"
      # A live test skipped for a missing server fails here instead (tests/conftest.py).
      VECTRAUDIT_REQUIRE_LIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Disk headroom
        # Free unused toolchains only when needed, then fail early with a clear message
        # rather than letting the search engines turn read-only mid-test.
        run: |
          df -h /
          if ! python3 scripts/live_backends.py headroom --min-free-gib 20; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
              /opt/hostedtoolcache/CodeQL
            df -h /
          fi
          python3 scripts/live_backends.py headroom
      - name: Start the ${{ matrix.track }} servers
        run: python3 scripts/live_backends.py up --track "${{ matrix.track }}"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-extras --locked
      - name: Connector, acceptance and tuning tests
        run: uv run pytest tests/test_connector_*.py tests/test_acceptance.py tests/test_tune.py
      - name: Control plane on this PostgreSQL
        run: uv run pytest -k postgresql
      - name: Server logs
        if: failure()
        run: |
          for name in $(docker ps -a --filter name=va-test- --format '{{.Names}}'); do
            echo "::group::$name"; docker logs --tail 200 "$name" 2>&1; echo "::endgroup::"
          done
