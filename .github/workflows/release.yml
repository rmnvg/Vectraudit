name: Release

# A version tag builds and tests the wheel, then publishes it with its SHA256SUMS as a
# GitHub release and uploads the same wheel to PyPI. Generated CI workflows install the
# GitHub release wheel, pinned by version and SHA-256.
#
# PyPI uses trusted publishing (OpenID Connect, no stored token). Before the first tag, add a
# trusted publisher on pypi.org for this repository, workflow `release.yml` and environment
# `pypi`. The PyPI job runs after the GitHub release, so a PyPI failure never blocks it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    name: Validate tagged commit
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    name: Build release wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build UI
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@v6
      - name: Tag must match the package version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi
      - run: uv build --wheel
      - name: Wheel contains the built UI
        run: |
          unzip -l dist/*.whl | grep -q "vectraudit/static/index.html"
      - name: Test release wheel in an isolated environment
        run: |
          uv venv "$RUNNER_TEMP/release-smoke"
          uv pip install --python "$RUNNER_TEMP/release-smoke/bin/python" dist/*.whl faiss-cpu httpx
          "$RUNNER_TEMP/release-smoke/bin/python" -I tests/package_smoke.py
      - name: Stage the wheel and its checksum
        run: uv run --no-project python scripts/stage_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: release-dist/

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "vectraudit $GITHUB_REF_NAME" --notes-file notes.md

  pypi:
    name: Publish to PyPI
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vectraudit/
    permissions:
      id-token: write   # trusted publishing; no other permission is needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: release-dist/
      - name: Upload only the wheel the GitHub release carries
        run: |
          mkdir dist
          mv release-dist/vectraudit-*-py3-none-any.whl dist/
          ls dist
      - uses: pypa/gh-action-pypi-publish@release/v1
