name: Release

# Private distribution only. Source-repository releases are maintainer-only; customer
# delivery uses a separate private repository and credential. Nothing goes to PyPI.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    name: Validate tagged commit
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    name: Build release wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build UI
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@v6
      - name: Tag must match the package version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi
      - run: uv build --wheel
      - name: Wheel contains the built UI
        run: |
          unzip -l dist/*.whl | grep -q "vectraudit/static/index.html"
      - name: Test release wheel in an isolated environment
        run: |
          uv venv "$RUNNER_TEMP/release-smoke"
          uv pip install --python "$RUNNER_TEMP/release-smoke/bin/python" dist/*.whl faiss-cpu httpx
          "$RUNNER_TEMP/release-smoke/bin/python" -I tests/package_smoke.py
      - name: Stage customer-safe assets and checksum
        run: uv run --no-project python scripts/prepare_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: customer-dist
          path: customer-dist/

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: customer-dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "vectraudit $GITHUB_REF_NAME" --notes-file notes.md

  distribution-release:
    name: Private customer distribution
    needs: build
    # Configure only after provisioning a source-free private repository and verifying
    # per-customer access. The environment can carry the owner's release approval rules.
    if: ${{ vars.VECTRAUDIT_DISTRIBUTION_REPOSITORY != '' }}
    environment: private-distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: customer-dist
          path: customer-dist/
      - name: Verify distribution destination and publish wheel
        env:
          GH_TOKEN: ${{ secrets.VECTRAUDIT_DISTRIBUTION_PUBLISH_TOKEN }}
          DISTRIBUTION_REPOSITORY: ${{ vars.VECTRAUDIT_DISTRIBUTION_REPOSITORY }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          GH_HOST: github.com
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          repository = os.environ['DISTRIBUTION_REPOSITORY']
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository):
              raise SystemExit('Expected distribution repository owner/name')
          if repository.casefold().removesuffix('.git') == os.environ['SOURCE_REPOSITORY'].casefold():
              raise SystemExit('Distribution must not use the source repository')
          result = subprocess.run(
              ['gh', 'repo', 'view', repository, '--json', 'isPrivate,isFork'],
              check=True, capture_output=True, text=True)
          metadata = json.loads(result.stdout)
          if not metadata['isPrivate'] or metadata['isFork']:
              raise SystemExit('Distribution requires a private, non-fork repository')
          PY
          gh release create "$GITHUB_REF_NAME" customer-dist/*.whl customer-dist/SHA256SUMS \
            --repo "$DISTRIBUTION_REPOSITORY" --title "vectraudit $GITHUB_REF_NAME" \
            --notes "Private Vectraudit wheel. Verify the reviewed SHA-256 before installation."
