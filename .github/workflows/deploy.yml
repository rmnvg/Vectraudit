name: Deployment rehearsal

# Brings up the self-hosted control plane with deploy/cloud/start.sh, then rehearses it end
# to end with deploy/cloud/rehearse.py: a workspace, a recorded and uploaded run, a backup,
# a deletion and a restore that must bring the run back. Runs on pull requests that touch
# the deployment or the control plane, on main, and before each release.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "deploy/cloud/**"
      - "src/vectraudit/cloud/**"
      - "src/vectraudit/integrations/cloud.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  workflow_call:

concurrency:
  # Distinct from the other workflows' groups when release.yml calls them all.
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rehearse:
    name: Compose deployment, backup and restore
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install the client (records and uploads the rehearsal run)
        run: uv sync --extra faiss-cpu --locked
      - name: Start the control plane
        run: deploy/cloud/start.sh
      - name: Rehearse
        run: uv run python deploy/cloud/rehearse.py --scratch
      - name: Service logs
        if: failure()
        working-directory: deploy/cloud
        run: docker compose logs --no-color --tail 200
