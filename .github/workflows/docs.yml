name: Docs site

# Builds docs/ with MkDocs Material in strict mode (a broken link or anchor fails it) on pull
# requests that touch the docs, and publishes the site to GitHub Pages from main. Publishing
# needs Pages enabled once: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "mkdocs/**", "pyproject.toml", "uv.lock", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "mkdocs/**", "pyproject.toml", "uv.lock", ".github/workflows/docs.yml"]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build (strict)
        run: uv run --only-group docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
