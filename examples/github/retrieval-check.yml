# A retrieval release check on every pull request (generated by `vectraudit init`).
#
# Lives at .github/workflows/retrieval-check.yml in the repository that owns your retrieval
# configuration. It expects:
#   retrieval/dataset.jsonl     labelled evaluation queries (vectraudit dataset validate)
#   retrieval/connection.json   how to reach the backend; secrets via *_env fields
#   retrieval/policy.json       when a change is acceptable
# The baseline uses the target branch's connection file and the candidate the pull
# request's, both measured in this job on the same runner, so latency is comparable.
#
# Security: this runs on `pull_request`, never `pull_request_target`, so pull requests from
# forks get no secrets and can't reach your database. Keep the backend read-only for the
# credentials below.

name: Retrieval check

on:
  pull_request:
    paths: ["retrieval/**", "src/**"]

permissions:
  contents: read
  checks: write          # --github-check: the verdict as a check on the pull request
  pull-requests: write   # --github-comment: one summary comment, updated on each push

jobs:
  retrieval-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VECTRAUDIT_VERSION: "0.1.0"
      # Copy the wheel's SHA-256 from the release's SHA256SUMS, then commit this pin.
      VECTRAUDIT_SHA256: "REPLACE_WITH_64_HEX_SHA256"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Retrieval check
        # Installs the pinned release, validates the dataset, records the target branch's
        # connection (baseline) and this pull request's (candidate), checks them and keeps the
        # report. Exit codes: 0 pass, 1 error, 3 fail, 4 not comparable. Publishing is best
        # effort: fork pull requests get a read-only token and only the job summary.
        uses: ./.github/actions/retrieval-check
        with:
          version: ${{ env.VECTRAUDIT_VERSION }}
          sha256: ${{ env.VECTRAUDIT_SHA256 }}
          extras: "qdrant"
          dataset: retrieval/dataset.jsonl
          connection: retrieval/connection.json
          policy: retrieval/policy.json
          repeats: 3
          # Each side's secrets reach only its record command.
          baseline-env: |
            QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }}
          candidate-env: |
            QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }}
