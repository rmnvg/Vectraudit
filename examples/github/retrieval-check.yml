# A retrieval release check on every pull request (generated by `vectraudit init`).
#
# Lives at .github/workflows/retrieval-check.yml in the repository that owns your retrieval
# configuration. It expects:
#   retrieval/dataset.jsonl     labelled evaluation queries (vectraudit dataset validate)
#   retrieval/connection.json   how to reach the backend; secrets via *_env fields
#   retrieval/policy.json       when a change is acceptable
# The baseline uses the target branch's connection file and the candidate the pull
# request's, both measured in this job on the same runner, so latency is comparable.
#
# Security: this runs on `pull_request`, never `pull_request_target`, so pull requests from
# forks get no secrets and can't reach your database. Keep the backend read-only for the
# credentials below.

name: Retrieval check

on:
  pull_request:
    paths: ["retrieval/**", "src/**"]

permissions:
  contents: read
  checks: write          # --github-check: the verdict as a check on the pull request
  pull-requests: write   # --github-comment: one summary comment, updated on each push

jobs:
  retrieval-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VECTRAUDIT_VERSION: "0.1.0"
      # Copy the wheel hash from the reviewed release handoff, then commit this pin.
      VECTRAUDIT_SHA256: "REPLACE_WITH_64_HEX_SHA256"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install vectraudit
        uses: ./.github/actions/install-vectraudit
        with:
          repository: ${{ vars.VECTRAUDIT_DISTRIBUTION_REPOSITORY }}
          version: ${{ env.VECTRAUDIT_VERSION }}
          sha256: ${{ env.VECTRAUDIT_SHA256 }}
          token: ${{ secrets.VECTRAUDIT_DOWNLOAD_TOKEN }}
          extras: "qdrant"

      - name: Validate the dataset
        run: vectraudit dataset validate retrieval/dataset.jsonl

      - name: Record the baseline (target branch configuration)
        env:
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        # A failed run still writes its file; `check` reports it as an error.
        run: |
          git worktree add "$RUNNER_TEMP/base" "origin/$GITHUB_BASE_REF"
          vectraudit record \
            --connection "$RUNNER_TEMP/base/retrieval/connection.json" \
            --dataset retrieval/dataset.jsonl \
            --out runs/baseline.json --label "$GITHUB_BASE_REF" --repeats 3 || true

      - name: Record the candidate (this pull request)
        env:
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          vectraudit record \
            --connection retrieval/connection.json \
            --dataset retrieval/dataset.jsonl \
            --out runs/candidate.json \
            --label "pr-${{ github.event.pull_request.number }}" --repeats 3 || true

      - name: Check
        # Exit codes: 0 pass, 1 error, 3 fail, 4 not comparable. Writes the job summary.
        # Publishing is best effort: fork pull requests get a read-only token and only
        # the job summary, never a broken check.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          vectraudit check runs/baseline.json runs/candidate.json \
            --policy retrieval/policy.json \
            --html runs/report.html --json runs/result.json \
            --github-check --github-comment

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-check
          path: runs/
