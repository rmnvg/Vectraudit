[project]
name = "vectraudit"
version = "0.1.0"
description = "Retrieval release checks, local relevance labelling and FAISS debugging."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [
    { name = "Ramanjot Singh", email = "ramanjotsingh247@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["faiss", "vector-search", "ann", "rag", "retrieval", "visualization", "debugging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    # PyPI rejects any upload carrying this classifier: a guard against publishing by mistake.
    "Private :: Do Not Upload",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
faiss-cpu = ["faiss-cpu>=1.8"]
umap = ["umap-learn>=0.5"]
text = ["sentence-transformers>=2.2"]
label-llm = ["transformers>=4.40", "torch>=2.2"]
parquet = ["pyarrow>=14"]
qdrant = ["qdrant-client>=1.13"]
weaviate = ["weaviate-client>=4.10"]
pgvector = ["psycopg[binary]>=3.1"]
cloud = ["sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.1"]
all = ["vectraudit[faiss-cpu,umap,text,parquet,qdrant,weaviate,pgvector,cloud]"]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "pre-commit>=3.5",
    "httpx>=0.27",
]

[project.scripts]
vectraudit = "vectraudit.cli:app"
vectraudit-cloud = "vectraudit.cloud.cli:app"

[project.urls]
Homepage = "https://github.com/rmnvg/Vectraudit"
Repository = "https://github.com/rmnvg/Vectraudit"
Issues = "https://github.com/rmnvg/Vectraudit/issues"
Changelog = "https://github.com/rmnvg/Vectraudit/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# static/ is gitignored (it's a build output) but must ship, so force-include it.
artifacts = ["src/vectraudit/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/vectraudit"]

[tool.hatch.build.targets.sdist]
# Anchored paths; the tests need examples/ (fixtures, notebook) and benchmarks/ to run from the sdist.
include = [
    "/src/vectraudit",
    "/tests",
    "/examples/*.py",
    "/examples/*.ipynb",
    "/benchmarks",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["frontend", "src/vectraudit/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "PT"]

[tool.mypy]
files = ["src/vectraudit"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "vectraudit.core.*",
    "vectraudit.evaluation.*",
    "vectraudit.connectors.*",
    "vectraudit.integrations.*",
    "vectraudit.cloud.*",
    "vectraudit.experiments.*",
    "vectraudit.labelling.*",
]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = ["slow: needs heavy optional deps (e.g. UMAP/numba); CI runs them with -m 'slow or not slow'"]

[tool.coverage.run]
source = ["vectraudit"]
branch = true
